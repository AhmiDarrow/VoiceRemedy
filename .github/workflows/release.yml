name: Release

# Push a v<version> tag to build and publish a release.
# Run manually without a tag to build the installers as workflow artifacts only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.7.1. Leave empty for a build-only dry run."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # SHA-256 of the dedicated release certificate introduced in 0.7.1.
  # The keystore that signed 0.7.0 (94d70554…) is no longer available, so
  # 0.7.0 users must uninstall once before installing 0.7.1.
  EXPECTED_APK_CERT_SHA256: 69f473e9a62c68b72b5d32b3c7e9198d1d3c2353df4aae35d9b7578ad2ee9215

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}"; PUBLISH=true
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG="${{ github.ref_name }}"; PUBLISH=true
          else TAG="v${VERSION}"; PUBLISH=false; fi
          node scripts/check-version.mjs "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Release $TAG (version $VERSION, publish=$PUBLISH)"

  build-windows:
    name: Windows installer
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - name: Build NSIS installer
        run: npm run desktop:build
      - name: Stage installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p out
          SRC=$(ls src-tauri/target/release/bundle/nsis/*_"${VERSION}"_x64-setup.exe)
          cp "$SRC" "out/VoiceRemedy-${VERSION}-Windows-Setup.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/*.exe
          if-no-files-found: error

  build-android:
    name: Android / Fire APK
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm test
      - name: Build web app and sync Capacitor
        run: npm run android:sync
      - name: Install release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${KEYSTORE_B64}" ] || [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ]; then
            echo "::error::Missing Android release signing secrets (ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_PASSWORD, ANDROID_RELEASE_KEY_ALIAS)."
            exit 1
          fi
          SIGN_DIR="$RUNNER_TEMP/voiceremedy-signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$SIGN_DIR/release.jks"
          printf '%s' "$STORE_PASSWORD" | tr -d '\r\n' > "$SIGN_DIR/store.pass"
          printf '%s' "$KEY_PASSWORD" | tr -d '\r\n' > "$SIGN_DIR/key.pass"
          printf '%s' "$KEY_ALIAS" | tr -d '\r\n' > "$SIGN_DIR/alias.txt"
          chmod 600 "$SIGN_DIR"/*
          test -s "$SIGN_DIR/release.jks"
          echo "Release keystore installed."
      - name: Assemble release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign release APK and verify certificate
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/voiceremedy-signing"
          cleanup() { rm -f "$SIGN_DIR/store.pass" "$SIGN_DIR/key.pass"; }
          trap cleanup EXIT
          VERSION="${{ needs.meta.outputs.version }}"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          fi
          test -n "$UNSIGNED" && test -f "$UNSIGNED"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          ALIGNED="$SIGN_DIR/aligned.apk"
          SIGNED="$SIGN_DIR/signed.apk"
          "${BT}zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          ALIAS=$(cat "$SIGN_DIR/alias.txt")
          "${BT}apksigner" sign \
            --ks "$SIGN_DIR/release.jks" \
            --ks-pass "file:$SIGN_DIR/store.pass" \
            --key-pass "file:$SIGN_DIR/key.pass" \
            --ks-key-alias "$ALIAS" \
            --out "$SIGNED" \
            "$ALIGNED"
          "${BT}apksigner" verify --print-certs "$SIGNED" | tee certs.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          EXPECTED=$(echo "$EXPECTED_APK_CERT_SHA256" | tr -d '[:space:]')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK certificate $ACTUAL does not match the release key ($EXPECTED)."
            exit 1
          fi
          mkdir -p out
          cp "$SIGNED" "out/VoiceRemedy-${VERSION}-Android-Fire.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [meta, build-windows, build-android]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          VERSION="${{ needs.meta.outputs.version }}"
          cp INSTALL.md out/INSTALL.md
          (cd out && sha256sum "VoiceRemedy-${VERSION}-Windows-Setup.exe" "VoiceRemedy-${VERSION}-Android-Fire.apk" > "SHA256SUMS-${VERSION}.txt")
          cat "out/SHA256SUMS-${VERSION}.txt"
          NOTES="releases/RELEASE-NOTES-${VERSION}.md"
          FILES=("out/VoiceRemedy-${VERSION}-Windows-Setup.exe" "out/VoiceRemedy-${VERSION}-Android-Fire.apk" out/INSTALL.md "out/SHA256SUMS-${VERSION}.txt")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "VoiceRemedy ${VERSION}" --notes-file "$NOTES" --draft=false --latest
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag --title "VoiceRemedy ${VERSION}" --notes-file "$NOTES" --latest
          fi
